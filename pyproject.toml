[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-safety-proxy"
version = "0.3.0a1"
description = "A local PostgreSQL safety proxy that warns before risky SQL mutations execute."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  {name = "SQL Safety Proxy contributors"}
]
keywords = ["sql", "postgresql", "database", "safety", "proxy", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "asyncpg>=0.31,<1",
  "sqlglot>=30,<31",
]

[project.scripts]
sql-safety-proxy = "sql_safety_proxy.cli:main"

[project.urls]
Homepage = "https://github.com/omardoesdata/sql-safety-proxy"
Repository = "https://github.com/omardoesdata/sql-safety-proxy"
Issues = "https://github.com/omardoesdata/sql-safety-proxy/issues"

[tool.setuptools.packages.find]
include = ["sql_safety_proxy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "build>=1.2",
]
