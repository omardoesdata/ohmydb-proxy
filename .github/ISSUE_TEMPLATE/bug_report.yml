name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private SQL, production data, or vulnerability details. Use a private Security Advisory for security issues."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0-alpha
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, PostgreSQL, and database driver versions
    validations:
      required: true
